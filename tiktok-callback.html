<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UMBJM Socials — Login TikTok</title>
<style>
  body { font-family: "Open Sans", system-ui, sans-serif; background: #f4f6fa; color: #2B2B2B; margin: 0; padding: 40px 16px; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(2,53,108,.08); }
  h1 { color: #02356C; font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.5; }
  code { display: block; word-break: break-all; background: #eef3fa; padding: 12px; border-radius: 8px; font-size: 14px; }
  button { margin-top: 12px; background: #02356C; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .err { color: #b00020; }
  small { color: #666; }
</style>
</head>
<body>
<main>
  <h1>UMBJM Socials — Login TikTok</h1>
  <div id="out"><p>Memproses…</p></div>
  <p><small>Halaman ini tidak mengirim data ke mana pun. Kode hanya ditampilkan agar disalin ke alat internal Humas UMBJM. Kode berlaku singkat dan hanya sekali pakai.</small></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var code = q.get('code'), err = q.get('error');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  if (code) {
    out.innerHTML = '<p>Login berhasil. Salin kode di bawah ini dan tempel ke terminal <b>tools/tiktok.py</b>:</p>' +
      '<code id="c">' + esc(code) + '</code>' +
      (q.get('state') ? '<p><small>state: ' + esc(q.get('state')) + '</small></p>' : '') +
      '<button id="b">Salin kode</button>';
    document.getElementById('b').onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById('b').textContent = 'Tersalin ✓'; });
    };
  } else if (err) {
    out.innerHTML = '<p class="err">Login dibatalkan atau gagal: ' + esc(err) + ' — ' + esc(q.get('error_description') || '') + '</p>';
  } else {
    out.innerHTML = '<p>Tidak ada kode login di alamat ini.</p>';
  }
  // Hapus kode dari bilah alamat & riwayat setelah ditampilkan.
  if (code || err) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
